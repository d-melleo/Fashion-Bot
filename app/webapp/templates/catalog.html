<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--tg-theme-hint-color);
            border-radius: 20px;
            background: transparent;
            color: var(--tg-theme-text-color);
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border-color: var(--tg-theme-button-color);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .product-card {
            background: var(--tg-theme-bg-color);
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-button-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--tg-theme-button-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #f44336;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-bg-color);
            border-radius: 20px 20px 0 0;
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 16px;
            border-radius: 12px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-description {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .modal-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--tg-theme-button-color);
            margin-bottom: 20px;
        }

        .close-btn {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍️ Fashion Catalog</h1>
        <p>Натисніть на товар для детальної інформації</p>
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" data-category="all">Все</button>
        <button class="filter-btn" data-category="men's clothing">Чоловічий одяг</button>
        <button class="filter-btn" data-category="women's clothing">Жіночий одяг</button>
        <button class="filter-btn" data-category="jewelery">Аксесуари</button>
    </div>

    <div class="products-grid" id="productsGrid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Завантаження каталогу...</p>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <!-- Буде заповнено динамічно -->
        </div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Застосування теми Telegram
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.backgroundColor);
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.textColor);
        document.documentElement.style.setProperty('--tg-theme-hint-color', tg.hintColor);
        document.documentElement.style.setProperty('--tg-theme-link-color', tg.linkColor);
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.buttonColor);
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.buttonTextColor);

        let allProducts = [];
        let currentCategory = 'all';

        // Завантаження товарів з Fake Store API
        async function loadProducts() {
            try {
                const response = await fetch('https://fakestoreapi.com/products');
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                showError('Помилка завантаження каталогу');
                console.error('Error loading products:', error);
            }
        }

        // Відображення товарів
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="loading"><p>Товари не знайдено</p></div>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="showProductDetails(${product.id})">
                    <img src="${product.image}" alt="${product.title}" class="product-image" loading="lazy">
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price.toFixed(2)}</div>
                    </div>
                </div>
            `).join('');
        }

        // Фільтрація товарів
        function filterProducts(category) {
            currentCategory = category;
            
            // Оновлення активної кнопки
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });

            // Фільтрація
            const filtered = category === 'all' 
                ? allProducts 
                : allProducts.filter(p => p.category === category);
            
            renderProducts(filtered);
            
            // Haptic feedback
            tg.HapticFeedback.impactOccurred('light');
        }

        // Показати деталі товару
        function showProductDetails(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;

            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            modalContent.innerHTML = `
                <img src="${product.image}" alt="${product.title}" class="modal-image">
                <div class="modal-title">${product.title}</div>
                <div class="modal-description">${product.description}</div>
                <div class="modal-price">${product.price.toFixed(2)}</div>
                <button class="close-btn" onclick="closeModal()">Закрити</button>
            `;

            modal.style.display = 'block';
            tg.HapticFeedback.impactOccurred('medium');

            // Закриття при кліку на фон
            modal.onclick = function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            };
        }

        // Закрити модальне вікно
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            tg.HapticFeedback.impactOccurred('light');
        }

        // Показати помилку
        function showError(message) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `
                <div class="error">
                    <p>❌ ${message}</p>
                    <button class="filter-btn" onclick="loadProducts()">Спробувати знову</button>
                </div>
            `;
        }

        // Обробка фільтрів
        document.getElementById('filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                filterProducts(e.target.dataset.category);
            }
        });

        // Повідомлення боту про готовність
        tg.ready();

        // Відправка даних боту (приклад)
        function sendDataToBot(data) {
            tg.sendData(JSON.stringify(data));
        }

        // Налаштування MainButton (опціонально)
        tg.MainButton.setText('Закрити каталог');
        tg.MainButton.onClick(() => {
            tg.close();
        });

        // Показати MainButton тільки коли товари завантажені
        tg.MainButton.hide();

        // Завантаження товарів при запуску
        loadProducts().then(() => {
            tg.MainButton.show();
        });

        // Обробка BackButton
        tg.BackButton.onClick(() => {
            const modal = document.getElementById('modal');
            if (modal.style.display === 'block') {
                closeModal();
            } else {
                tg.close();
            }
        });
    </script>
</body>
</html>
