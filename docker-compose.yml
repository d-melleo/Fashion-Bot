services:
  mongodb:
    image: mongo:7.0
    container_name: fashion_bot_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - bot_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fashion_bot_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5675:5672"
      - "15675:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bot_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: fashion_bot_webapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ngrok_shared:/tmp/shared
    ports:
      - "8000:8000"
      - "4040:4040"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fashion_bot_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DATABASE}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - bot_data:/app/data
      - ngrok_shared:/tmp/shared
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      webapp:
        condition: service_healthy
    networks:
      - bot_network
    # Використовується watchfiles для hot reload
    command: ["sh", "-c", "./wait-for-rabbit.sh watchfiles --filter python 'python -m app.main'"]

  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DATABASE}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
      - WORKER_TYPE=ai_generation
    volumes:
      - ./workers:/app/workers
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bot:
        condition: service_started
    networks:
      - bot_network
    # Автоматичне оновлення для воркерів
    command: ["sh", "-c", "./wait-for-rabbit.sh watchfiles --filter python 'python -m workers.ai_worker'"]

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rabbitmq_data:
    driver: local
  bot_data:
    driver: local
  ngrok_shared:
    driver: local

networks:
  bot_network:
    driver: bridge